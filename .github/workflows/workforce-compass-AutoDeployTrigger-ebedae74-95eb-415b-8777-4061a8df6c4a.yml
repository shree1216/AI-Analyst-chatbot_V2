name: Trigger auto deployment for workforce-compass

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches:
      [ main ]
    # The Azure app reads Azure SQL directly, so demo data syncs do not need a rebuild.
    paths-ignore:
    - 'demo_data/**'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONTAINER_IMAGE: workforcecompassacr.azurecr.io/workforce-compass:${{ github.sha }}
    permissions:
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.WORKFORCECOMPASS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.WORKFORCECOMPASS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.WORKFORCECOMPASS_AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: workforcecompassacr.azurecr.io
          username: ${{ secrets.WORKFORCECOMPASS_REGISTRY_USERNAME }}
          password: ${{ secrets.WORKFORCECOMPASS_REGISTRY_PASSWORD }}

      - name: Build and push the commit image
        run: |
          set -euo pipefail
          docker build --file Dockerfile --tag "$CONTAINER_IMAGE" .
          docker push "$CONTAINER_IMAGE"

      - name: Update the existing application container
        run: |
          set -euo pipefail
          az containerapp update --name workforce-compass --resource-group workforce_rg1 \
            --container-name simple-hello-world-container --image "$CONTAINER_IMAGE" --output none

      - name: Verify public app and publish its URL
        run: |
          set -euo pipefail
          verified=false
          for attempt in $(seq 1 30); do
            deployed_image=$(az containerapp show --name workforce-compass --resource-group workforce_rg1 --query "properties.template.containers[?name=='simple-hello-world-container'].image | [0]" --output tsv)
            latest=$(az containerapp show --name workforce-compass --resource-group workforce_rg1 --query 'properties.latestRevisionName' --output tsv)
            ready=$(az containerapp show --name workforce-compass --resource-group workforce_rg1 --query 'properties.latestReadyRevisionName' --output tsv)
            if [ "$deployed_image" = "$CONTAINER_IMAGE" ] && [ -n "$ready" ] && [ "$latest" = "$ready" ]; then
              verified=true
              break
            fi
            echo "Waiting for the commit image to become ready (attempt ${attempt}/30)."
            sleep 10
          done
          if [ "$verified" != true ]; then
            echo "::error::The image built from this commit did not become the ready revision."
            exit 1
          fi
          fqdn=$(az containerapp show --name workforce-compass --resource-group workforce_rg1 --query 'properties.configuration.ingress.fqdn' --output tsv)
          if [ -z "$fqdn" ]; then
            echo "::error::The Container App has no public hostname."
            exit 1
          fi
          curl --fail --show-error --silent --retry 12 --retry-delay 5 --retry-all-errors --max-time 20 "https://${fqdn}/_stcore/health"
          printf '\n### Hosted Workforce Compass\n\nhttps://%s\n\nDeployed commit: `%s`\n' "$fqdn" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
