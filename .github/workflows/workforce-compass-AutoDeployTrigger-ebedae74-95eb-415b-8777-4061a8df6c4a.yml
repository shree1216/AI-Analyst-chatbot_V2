name: Trigger auto deployment for workforce-compass

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    # The Azure app reads Azure SQL directly, so demo data syncs do not need a rebuild.
    paths-ignore:
    - 'demo_data/**'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.WORKFORCECOMPASS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.WORKFORCECOMPASS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.WORKFORCECOMPASS_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: workforcecompassacr.azurecr.io
          registryUsername: ${{ secrets.WORKFORCECOMPASS_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.WORKFORCECOMPASS_REGISTRY_PASSWORD }}
          containerAppName: workforce-compass
          resourceGroup: workforce_rg1
          imageToBuild: workforcecompassacr.azurecr.io/workforce-compass:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


